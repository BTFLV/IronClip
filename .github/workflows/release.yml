name: Release

# Every commit on main builds, tests and validates the plug-ins, then updates
# the rolling release "Latest IronClip Release" (tag: rolling). Can also be
# started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check branch
    runs-on: ubuntu-latest
    steps:
      - name: Only release from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases are published from main only (got $GITHUB_REF)." >&2
          exit 1

  build:
    name: Build and validate
    needs: check
    uses: ./.github/workflows/ci.yml
    with:
      sign: true
    secrets: inherit

  publish:
    name: Publish rolling release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: IronClip-*
          path: dist
          merge-multiple: true

      - name: Prepare checksums and release notes
        run: |
          cd dist
          sha256sum IronClip-macOS-universal.zip IronClip-Windows-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          case "$(cat macos-signing-status.txt)" in
            notarized) signing="signed with a Developer ID certificate and notarized by Apple." ;;
            signed) signing="code-signed with a Developer ID certificate but **not notarized**; macOS may still require removing the quarantine flag (see INSTALL.txt)." ;;
            *) signing="**not code-signed or notarized.** macOS Gatekeeper will refuse to load it until you remove the quarantine flag as described in INSTALL.txt." ;;
          esac
          version="$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' ../CMakeLists.txt | head -n 1)"
          sed -e "s|@VERSION@|$version|g" \
              -e "s|@COMMIT@|$GITHUB_SHA|g" \
              -e "s|@COMMIT_SHORT@|${GITHUB_SHA::7}|g" \
              -e "s|@REPOSITORY@|$GITHUB_REPOSITORY|g" \
              -e "s|@DATE@|$(date -u '+%Y-%m-%d %H:%M UTC')|g" \
              -e "s|@MACOS_SIGNING@|The macOS build is $signing|g" \
              ../.github/release-notes.md > release-notes.md
          cat release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          scripts/publish-rolling-release.sh dist dist/release-notes.md
          IronClip-macOS-universal.zip IronClip-Windows-x64.zip SHA256SUMS.txt
